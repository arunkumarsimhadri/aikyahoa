spring:
  datasource:
    url: jdbc:h2:mem:aikya_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS public
    username: aikya_app_user
    password: your_secure_password_here
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

aikya:
  security:
    jwt-secret: aW5kaWFuLWFwYXJ0bWVudC1haWt5YS1zZWNyZXQta2V5LTIwMjYtdW5pdHktb25lbmVzcw==
    jwt-expiration-ms: 86400000
    otp-expiration-seconds: 300
    mock-otp-enabled: true
  seed:
    enabled: true

