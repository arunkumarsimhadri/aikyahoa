server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aikya-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.10.80:5432/aikya_db}
    username: ${DB_USERNAME:aikya_app_user}
    password: ${DB_PASSWORD:your_secure_password_here}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
  flyway:
    enabled: false

aikya:
  security:
    jwt-secret: ${AIKYA_JWT_SECRET:aW5kaWFuLWFwYXJ0bWVudC1haWt5YS1zZWNyZXQta2V5LTIwMjYtdW5pdHktb25lbmVzcw==}
    jwt-expiration-ms: 86400000
    otp-expiration-seconds: 300
    mock-otp-enabled: true
  seed:
    enabled: ${AIKYA_SEED_ENABLED:true}
  storage:
    provider: ${AIKYA_STORAGE_PROVIDER:MINIO_S3}
    minio:
      endpoint: ${AIKYA_MINIO_ENDPOINT:http://192.168.10.83}
      bucket: ${AIKYA_MINIO_BUCKET:aikya-storage}
      access-key: ${AIKYA_MINIO_ACCESS_KEY:admin}
      secret-key: ${AIKYA_MINIO_SECRET_KEY:hxfCnBm21oiRMSoQ72FhzCOxwzjjV840}
      region: ${AIKYA_MINIO_REGION:us-east-1}
    local-dir: ${AIKYA_STORAGE_DIR:/tmp/aikya-uploads}

